name: CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Lint backend
        run: npm run lint
        working-directory: backend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Build backend
        run: |
          npx prisma generate
          npm run build
        working-directory: backend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=http://54.162.235.197/api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/studyai-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/studyai-frontend:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/studyai-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/studyai-backend:latest
  
  cd:
    name: CD
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
  
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/studyai-frontend:latest
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/studyai-backend:latest
  
            sudo bash -c '
              cd /home/studyai/app &&
              git pull origin main &&
              docker compose -f docker-compose.prod.yml pull &&
              docker compose -f docker-compose.prod.yml up -d --force-recreate
            '
  
            sudo docker ps
