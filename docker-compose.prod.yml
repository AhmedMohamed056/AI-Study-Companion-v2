# StudyAI Production Docker Compose

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyai-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    networks:
      - studyai-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studyai-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    networks:
      - studyai-network
    depends_on:
      - backend

networks:
  studyai-network:
    driver: bridge
